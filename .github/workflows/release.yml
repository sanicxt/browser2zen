name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the release artifact (e.g. 1.0.0)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Refusing version '$VERSION' (must be like 1.2.3 or 1.2.3-rc1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-version
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Render app icon
        run: bash build/make_iconset.sh

      - name: Build .app
        run: bash build/make_app.sh

      - name: Smoke-test the bundle
        # Launch the app, give WKWebView ~5 seconds to render, then quit.
        # If the .app crashes on launch (e.g. WebKit framework missing) the
        # process exits before our timer fires and the build fails.
        run: |
          set -e
          dist/browser2zen.app/Contents/MacOS/browser2zen &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::macOS bundle exited prematurely on launch"
            exit 1
          fi
          osascript -e 'tell application "browser2zen" to quit' || kill $PID
          wait $PID 2>/dev/null || true

      - name: Build .dmg
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash build/make_dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/browser2zen-*.dmg
          if-no-files-found: error

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
        shell: pwsh

      - name: Render app icon
        run: pwsh -NoProfile -File build/make_iconset.ps1
        shell: pwsh

      - name: Build .exe
        run: pwsh -NoProfile -File build/make_exe.ps1
        shell: pwsh

      - name: Smoke-test the bundle
        # Launch the .exe, wait ~5 s, ensure the process is still alive,
        # then stop it. Catches missing PyInstaller hidden imports
        # (clr_loader, pythonnet) that crash on first window create.
        run: |
          $proc = Start-Process -FilePath "dist/browser2zen/browser2zen.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "Windows bundle exited prematurely (exit code $($proc.ExitCode))"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
        shell: pwsh

      - name: Build .zip
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: pwsh -NoProfile -File build/make_zip.ps1
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/browser2zen-*.zip
          if-no-files-found: error

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GTK runtime + build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          # Pin pygobject < 3.50 so it builds against girepository-1.0
          # (what gir1.2-webkit2-4.1 / Ubuntu 22.04 provides). 3.50+
          # requires girepository-2.0, only available in Ubuntu 24+.
          pip install 'pygobject<3.50' pycairo

      - name: Build .tar.gz
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -e
          pyinstaller --noconfirm --clean build/browser2zen.spec
          # PyInstaller leaves dist/browser2zen/browser2zen + _internal/.
          test -x dist/browser2zen/browser2zen
          # Smoke-test under xvfb so the GTK init doesn't crash.
          xvfb-run -a dist/browser2zen/browser2zen --debug &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "::error::Linux bundle exited prematurely on launch"
            exit 1
          fi
          kill $PID || true
          wait $PID 2>/dev/null || true
          # Bundle as tar.gz with the browser2zen folder at the top.
          ARCHIVE="dist/browser2zen-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "$ARCHIVE" -C dist browser2zen
          ls -lh "$ARCHIVE"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/browser2zen-*.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-tar
          path: artifacts/

      - name: Stage release files
        run: |
          ls -la artifacts/
          cp build/INSTRUCTIONS.txt artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: browser2zen ${{ needs.resolve-version.outputs.version }}
          body: |
            browser2zen ${{ needs.resolve-version.outputs.version }}

            **macOS (Apple Silicon):** download `browser2zen-*-arm64.dmg`.
            **Windows (x64):** download `browser2zen-*-win-x64.zip`.
            **Linux (x86_64):** download `browser2zen-*-linux-x86_64.tar.gz`.

            ## First launch (one-time setup)

            macOS will block the app the first time because browser2zen isn't
            notarized. To allow it:

            1. Double-click `browser2zen.app` — macOS shows a "damaged" or
               "cannot verify" dialog. Click **Done**.
            2. Open **System Settings → Privacy & Security**.
            3. Scroll down and click **Open Anyway** next to the message
               about browser2zen.
            4. Enter your Mac password if prompted.
            5. Click **Open Anyway** in the final confirmation dialog.

            On Windows: right-click the downloaded `.zip` → **Properties**
            → **Unblock** → OK before extracting (this strips the
            Mark-of-the-Web from every file inside in one shot). After
            extracting, double-click `browser2zen.exe`. SmartScreen may show
            "Windows protected your PC" — click **More info** → **Run
            anyway**.

            On Linux: extract the tarball (`tar -xzf browser2zen-*-linux-x86_64.tar.gz`)
            and run `./browser2zen/browser2zen`. Requires GTK 3 + WebKit2GTK at
            runtime: `sudo apt install python3-gi gir1.2-webkit2-4.1` on Debian /
            Ubuntu, equivalent packages on Fedora and Arch.

            Full instructions are also bundled inside each artifact as
            `INSTRUCTIONS.txt`.
          files: |
            artifacts/browser2zen-*.dmg
            artifacts/browser2zen-*.zip
            artifacts/browser2zen-*.tar.gz
            artifacts/INSTRUCTIONS.txt
          fail_on_unmatched_files: true

  update-homebrew-tap:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    # Only on tag pushes that match v*. Manual workflow_dispatch is
    # intentionally skipped: it doesn't actually publish a release with
    # downloadable artifacts, so the cask URL would 404.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Pull DMG sha256 from the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub computes the digest itself when the asset is uploaded.
          # We just read it from the API; no need to re-download.
          DIGEST=$(gh api "repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            --jq '.assets[] | select(.name | endswith("-arm64.dmg")) | .digest')
          if [ -z "$DIGEST" ]; then
            echo "::error::No -arm64.dmg asset found on v${VERSION} release"
            exit 1
          fi
          # Strip the "sha256:" prefix that the API returns.
          SHA256="${DIGEST#sha256:}"
          echo "Resolved sha256=$SHA256"
          echo "DMG_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Clone tarikbc/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping tap update."
            echo "SKIP_TAP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git clone "https://oauth2:${TAP_TOKEN}@github.com/tarikbc/homebrew-tap.git" tap
          cd tap
          git config user.name "browser2zen-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update cask
        if: ${{ env.SKIP_TAP != '1' }}
        run: |
          set -euo pipefail
          cd tap
          # Surgical replace: only the version + sha256 lines change.
          sed -i -E "s|^  version \"[^\"]+\"$|  version \"${VERSION}\"|" Casks/browser2zen.rb
          sed -i -E "s|^  sha256 \"[a-f0-9]+\"$|  sha256 \"${DMG_SHA256}\"|" Casks/browser2zen.rb
          echo "--- diff ---"
          git diff Casks/browser2zen.rb
          if git diff --quiet Casks/browser2zen.rb; then
            echo "Cask already at version ${VERSION}; nothing to do."
            exit 0
          fi
          git add Casks/browser2zen.rb
          git commit -m "browser2zen ${VERSION}"
          git push origin main
