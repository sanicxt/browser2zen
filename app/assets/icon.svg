<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outer macOS-style rounded-square card with subtle gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1B22"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <!-- Zen badge (gunmetal) -->
    <linearGradient id="zenBg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2B2B2F"/>
      <stop offset="70%" stop-color="#15151A"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
    <!-- Soft drop shadow used for every floating element -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.40"/>
    </filter>
    <!-- Inner highlight for the small brand chips, faking a soft 3D look -->
    <linearGradient id="chipShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- App background (rounded square, ~22% radius is the macOS standard) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>

  <!-- ================================================================
       Left side: cluster of six brand-tinted chips representing the
       supported source browsers. 3 columns x 2 rows, each chip 100x100
       with 30px gaps. Cluster anchor (110, 380), total 360x230, centred
       in the left half of the card. Solid brand colours so the silhouette
       survives 16 px rasterisation.
       ================================================================ -->

  <!-- Row 1 -->
  <g transform="translate(110 380)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#FF536A"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>
  <g transform="translate(240 380)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#FB542B"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>
  <g transform="translate(370 380)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#FF9500"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(110 510)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#FBBC04"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>
  <g transform="translate(240 510)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#1FBED6"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>
  <g transform="translate(370 510)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="24" ry="24" fill="#0078D4"/>
    <rect width="100" height="100" rx="24" ry="24" fill="url(#chipShine)"/>
  </g>

  <!-- ================================================================
       Centre arrow. Lives between the cluster and the Zen badge.
       ================================================================ -->
  <g transform="translate(528 510)" stroke="#FFFFFF" stroke-width="14"
     fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <line x1="-22" y1="0" x2="22" y2="0"/>
    <polyline points="6,-22 26,0 6,22"/>
  </g>

  <!-- ================================================================
       Right side: Zen badge with three concentric rings, mirroring the
       brand-mark.zen styling in the GUI.
       ================================================================ -->
  <g transform="translate(620 350)" filter="url(#cardShadow)">
    <rect width="320" height="320" rx="68" ry="68" fill="url(#zenBg)"/>
    <g transform="translate(160 160)" stroke="#F2F2F4" stroke-width="11" fill="none">
      <circle r="118"/>
      <circle r="78"/>
      <circle r="38"/>
    </g>
  </g>
</svg>
