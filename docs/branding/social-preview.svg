<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1B22"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <linearGradient id="chipShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg)"/>

  <!-- ============ icon strip on the left, vertically centred ============ -->
  <!-- Six brand chips, anchored at (110, 240). Each 80x80, gap 24. -->
  <g transform="translate(110 240)">
    <!-- Row 1 -->
    <g transform="translate(0 0)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#FF536A"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
    <g transform="translate(104 0)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#FB542B"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
    <g transform="translate(208 0)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#FF9500"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0 104)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#FBBC04"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
    <g transform="translate(104 104)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#1FBED6"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
    <g transform="translate(208 104)" filter="url(#cardShadow)">
      <rect width="80" height="80" rx="20" ry="20" fill="#0078D4"/>
      <rect width="80" height="80" rx="20" ry="20" fill="url(#chipShine)"/>
    </g>
  </g>

  <!-- Arrow between chips and Zen badge -->
  <g transform="translate(450 320)" stroke="#FFFFFF" stroke-width="10"
     fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <line x1="-22" y1="0" x2="22" y2="0"/>
    <polyline points="6,-18 26,0 6,18"/>
  </g>

  <!-- Zen badge: concentric-circles mark (homarr-labs/dashboard-icons,
       zen-browser-dark variant). Source canvas is 1024x1024 with 82 px
       insets. We fit it into a 200x200 area at (520, 220) by scaling
       0.1953125 (200/1024) and translating to remove the inset. -->
  <g transform="translate(520 220)" filter="url(#cardShadow)">
    <g transform="scale(0.1953125) translate(-82 -82)">
      <rect x="82" y="82" width="860" height="860" rx="155.371" fill="#202020"/>
      <circle cx="512.439" cy="512.439" r="113.02" stroke="#F2F0E3" stroke-width="25.1953" fill="none"/>
      <circle cx="512.439" cy="512.439" r="197.737" stroke="#F2F0E3" stroke-width="41.9922" fill="none"/>
      <circle cx="512.439" cy="512.439" r="298.266" stroke="#F2F0E3" stroke-width="58.7891" fill="none"/>
    </g>
  </g>

  <!-- ============ text on the right ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
     fill="#F2F2F4">
    <text x="780" y="280" font-size="76" font-weight="700">browser2zen</text>
    <text x="780" y="340" font-size="30" fill="#A0A4AB" font-weight="400">
      Migrate any browser into Zen.
    </text>
    <text x="780" y="385" font-size="22" fill="#7A7E85" font-weight="400">
      Arc · Chrome · Edge · Brave · Firefox · Safari
    </text>
    <text x="780" y="450" font-size="18" fill="#5A5E65" font-weight="400">
      Workspaces · Pinned tabs · Bookmarks · History · Cookies
    </text>
  </g>
</svg>
